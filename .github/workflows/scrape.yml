name: Scrape HDDBroker listings

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python scraper/scrape_hddbroker.py

      - name: Commit updated data
        run: |
          git config user.name "mti-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Update listings $(date -u +%Y-%m-%d)"
          git push
